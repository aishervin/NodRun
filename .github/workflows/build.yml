name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate versions and tests
        run: |
          npm run check:versions
          npm test

      - name: Prepare persistent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 Actions secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD Actions secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS Actions secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD Actions secret}"
          release_keystore="${RUNNER_TEMP}/nodrun-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$release_keystore"
          chmod 600 "$release_keystore"
          keytool -list -keystore "$release_keystore" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/nodrun-release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodrun-android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NodRun ${{ github.ref_name }}
          body: |
            Signed Android release APK built with NodRun's persistent release key.

            Because the signing certificate changed from the previously public debug key, uninstall older builds before installing this release.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
