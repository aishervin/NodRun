name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build Android App Bundle (AAB) with EAS / Expo
      run: |
        # Use local build or expo prebuild if needed, or gradle if android folder exists
        if [ -d "android" ]; then
          cd android
          ./bundleRelease || ./gradlew bundleRelease
        else
          npx expo run:android --variant release
        fi

    - name: Find and Rename APK/AAB Output
      run: |
        mkdir -p release_output
        find . -name "*.apk" -o -name "*.aab" | grep -v "node_modules" || true

    - name: Create GitHub Release and Upload Output
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
      with:
        tag_name: ${{ github.ref_name == 'main' && 'v1.0.42' || github.ref_name }}
        name: "NodRun Release ${{ github.ref_name == 'main' && 'v1.0.42' || github.ref_name }} (Exclusive SHΞN™ made)"
        files: |
          android/app/build/outputs/apk/release/*.apk
          android/app/build/outputs/bundle/release/*.aab
          android/app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
