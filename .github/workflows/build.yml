name: Build Android APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version metadata
        run: npm run check:versions

      - name: Prepare persistent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 Actions secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD Actions secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS Actions secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD Actions secret}"
          release_keystore="${RUNNER_TEMP}/nodrun-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$release_keystore"
          chmod 600 "$release_keystore"
          keytool -list -keystore "$release_keystore" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APKs
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/nodrun-release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease -Pandroid.enableAbiSplits=true

      - name: Name APKs by version and architecture
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.json').expo.version")"
          apk_dir="android/app/build/outputs/apk/release"
          out_dir="dist/apks"
          mkdir -p "$out_dir"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            source="$apk_dir/app-${abi}-release.apk"
            destination="$out_dir/NodRun-v${version}-${abi}.apk"
            test -s "$source"
            cp "$source" "$destination"
          done

      - name: Verify APK metadata, ABI, and signature
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"
          version="$(node -p "require('./app.json').expo.version")"
          version_code="$(node -p "require('./app.json').expo.android.versionCode")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="dist/apks/NodRun-v${version}-${abi}.apk"
            test -s "$apk"
            "$apksigner" verify --verbose "$apk"
            metadata="$("$aapt" dump badging "$apk")"
            printf '%s\n' "$metadata" | grep -F "package: name='cc.agentlabs.opencode' versionCode='${version_code}' versionName='${version}'"
            printf '%s\n' "$metadata" | grep -F "application-label:'NodRun'"
            printf '%s\n' "$metadata" | grep -E "application: label='NodRun' icon='[^']+'"
            apk_abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u)"
            test "$apk_abis" = "$abi"
          done

      - name: Upload architecture-specific APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodrun-android-${{ github.ref_name }}
          path: dist/apks/NodRun-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NodRun Android ${{ github.ref_name }}
          body: |
            Three signed Android release APKs, each built for one device architecture with NodRun's persistent release key and launcher logo.

            Choose the file matching your device:
            - arm64-v8a: most current Android phones and tablets
            - armeabi-v7a: older 32-bit ARM devices
            - x86_64: x86-based Android devices and emulators
          files: dist/apks/NodRun-*.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
